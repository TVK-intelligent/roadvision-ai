# Cấu hình dữ liệu huấn luyện YOLOv8 cho hệ thống RoadVision
# Tham khảo: SamaIsmail91/Road-Damage-Detection (RDD2022) + jaygala24/pothole-detection

path: /content/dataset
train: images/train
val: images/val
test: images/test

nc: 4

names:
  0: POTHOLE        # Ổ gà / Hố sụt mặt đường
