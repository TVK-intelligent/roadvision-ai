# Cấu hình dữ liệu huấn luyện YOLOv8 cho hệ thống RoadVision
# Tham khảo: SamaIsmail91/Road-Damage-Detection (RDD2022) + jaygala24/pothole-detection

path: /content/dataset
train: images/train
val: images/val
test: images/test

nc: 4

names:
  0: POTHOLE        # Ổ gà / Hố sụt mặt đường
  1: ROAD_CRACK     # Vết nứt mặt đường
  2: ROAD_FLOODING  # Điểm ngập úng mặt đường
  3: ROAD_OBSTACLE  # Vật cản, chướng ngại vật (Cây đổ / cành cây chắn đường - tree fallen, thùng xốp, rào chắn, cọc tiêu, sọt rác, chậu cây lấn chiếm)
